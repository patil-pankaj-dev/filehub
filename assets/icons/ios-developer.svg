<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225" fill="none">
  <rect width="400" height="225" rx="12" fill="#18181b"/>
  <rect x="1" y="1" width="398" height="223" rx="11" stroke="#27272a" stroke-width="2"/>
  
  <!-- Apple / Swift Flight Shape / iOS UI Stack -->
  <g transform="translate(130, 40)">
    <!-- iOS device frame with Dynamic Island -->
    <rect width="140" height="150" rx="20" fill="#09090b" stroke="#ef4444" stroke-width="2"/>
    <rect x="42" y="10" width="56" height="12" rx="6" fill="#18181b"/>
    <circle cx="85" cy="16" r="3" fill="#27272a"/>

    <!-- SwiftUI Components -->
    <rect x="15" y="32" width="110" height="24" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="70" y="48" fill="#fafafa" font-family="system-ui, -apple-system" font-size="10" font-weight="600" text-anchor="middle">SwiftUI Navigation</text>

    <!-- App Grid -->
    <rect x="15" y="64" width="32" height="32" rx="8" fill="#ef4444" fill-opacity="0.8"/>
    <rect x="54" y="64" width="32" height="32" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <rect x="93" y="64" width="32" height="32" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>

    <rect x="15" y="104" width="110" height="28" rx="6" fill="#18181b" stroke="#ef4444" stroke-width="1"/>
    <text x="70" y="122" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Xcode &amp; Swift 6</text>
  </g>

  <!-- Side Tags -->
  <rect x="30" y="90" width="80" height="28" rx="14" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="70" y="108" fill="#fafafa" font-family="system-ui, -apple-system" font-size="11" font-weight="600" text-anchor="middle">UIKit</text>

  <rect x="290" y="90" width="80" height="28" rx="14" fill="#09090b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="330" y="108" fill="#fafafa" font-family="system-ui, -apple-system" font-size="11" font-weight="600" text-anchor="middle">CoreData</text>
</svg>